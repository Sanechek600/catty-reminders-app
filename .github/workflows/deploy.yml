name: CD

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          username: vboxuser
          port: 2454
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          timeout: 60s
          command_timeout: 10m
          debug: true
          script: |
            set -euxo pipefail
            systemctl is-active frpc || echo "frpc is not active (ok for CI step)"
            cd ~/Desktop/DevOps/Lab1/
            bash -x ./deploy.sh
