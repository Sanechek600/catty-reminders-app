name: CI Docker (no integration tests)

on:
  push:
    branches: [ multicontainers ]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set lowercase repo owner
        run: echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/catty-reminders-app:latest
            ghcr.io/${{ env.OWNER_LOWER }}/catty-reminders-app:${{ github.sha }}

      - name: Lint Dockerfile
        continue-on-error: true
        run: docker run --rm -i hadolint/hadolint < Dockerfile
